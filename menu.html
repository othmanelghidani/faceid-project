<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<header
  class="sticky top-0 z-50
         bg-gradient-to-r from-[#0a0015]/95 via-[#050008]/95 to-black/95
         border-b border-purple-500/30
         shadow-[0_5px_25px_rgba(124,58,237,0.2)]
         backdrop-blur-sm">

  <div class="max-w-6xl mx-auto px-6 py-2.5 flex justify-between items-center">

    <!-- LOGO COMPACT -->
    <div class="flex items-center gap-3 group cursor-pointer">
      <div class="relative">
        <div class="absolute inset-0 bg-purple-500/20 blur-[2px] rounded-full group-hover:bg-sky-500/20 transition-all duration-300"></div>
        <i class="bi bi-camera-video-fill text-xl relative z-10 text-purple-300 group-hover:text-sky-300 transition-all duration-300"></i>
      </div>
      <h1
        class="text-xl font-black tracking-tight
               bg-gradient-to-r from-purple-300 to-sky-300
               bg-clip-text text-transparent
               drop-shadow-[0_0_10px_rgba(124,58,237,0.6)]">
        FACE<span class="text-sky-400">X</span>
      </h1>
    </div>

    <!-- NAV COMPACTE -->
    <nav class="flex items-center gap-4 text-sm font-medium">

      <!-- ACCUEIL -->
      <a href="index.html"
         class="text-gray-300 hover:text-white px-3 py-1.5 rounded-lg
                transition-all duration-200
                bg-gradient-to-r from-purple-500/0 to-sky-500/0
                hover:from-purple-500/10 hover:to-sky-500/10
                border border-transparent hover:border-purple-500/20
                group relative">
        <span class="flex items-center gap-2">
          <i class="bi bi-house-door text-xs text-purple-400 group-hover:text-sky-300 transition-colors duration-200"></i>
          <span>Accueil</span>
        </span>
        <div class="absolute -bottom-1 left-3 right-3 h-[1px] bg-gradient-to-r from-purple-500 to-sky-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300"></div>
      </a>

      <!-- SIGNUP -->
      <a href="signup.html"
         class="text-gray-300 hover:text-white px-3 py-1.5 rounded-lg
                transition-all duration-200
                bg-gradient-to-r from-purple-500/0 to-sky-500/0
                hover:from-purple-500/10 hover:to-sky-500/10
                border border-transparent hover:border-purple-500/20
                group relative">
        <span class="flex items-center gap-2">
          <i class="bi bi-person-plus text-xs text-sky-400 group-hover:text-purple-300 transition-colors duration-200"></i>
          <span>Signup</span>
        </span>
        <div class="absolute -bottom-1 left-3 right-3 h-[1px] bg-gradient-to-r from-sky-500 to-purple-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300"></div>
      </a>

      <!-- LOGIN -->
      <a href="login.html"
         class="text-gray-300 hover:text-white px-3 py-1.5 rounded-lg
                transition-all duration-200
                bg-gradient-to-r from-purple-500/0 to-sky-500/0
                hover:from-purple-500/10 hover:to-sky-500/10
                border border-transparent hover:border-purple-500/20
                group relative">
        <span class="flex items-center gap-2">
          <i class="bi bi-box-arrow-in-right text-xs text-purple-400 group-hover:text-sky-300 transition-colors duration-200"></i>
          <span>Login</span>
        </span>
        <div class="absolute -bottom-1 left-3 right-3 h-[1px] bg-gradient-to-r from-purple-500 to-sky-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300"></div>
      </a>

      <!-- ADMIN (MÊME STYLE QUE LES AUTRES) -->
      <a href="admin.html"
         class="text-gray-300 hover:text-white px-3 py-1.5 rounded-lg
                transition-all duration-200
                bg-gradient-to-r from-purple-500/0 to-sky-500/0
                hover:from-purple-500/10 hover:to-sky-500/10
                border border-transparent hover:border-purple-500/20
                group relative">
        <span class="flex items-center gap-2">
          <i class="bi bi-shield-lock text-xs text-sky-400 group-hover:text-purple-300 transition-colors duration-200"></i>
          <span>Admin</span>
        </span>
        <div class="absolute -bottom-1 left-3 right-3 h-[1px] bg-gradient-to-r from-sky-500 to-purple-500 transform scale-x-0 group-hover:scale-x-100 transition-transform duration-300"></div>
      </a>

    </nav>

  </div>

  <!-- BARRE DE PROGRESSION FUTURISTE MINIMALISTE -->
  <div class="h-[1px] w-full bg-gradient-to-r from-transparent via-purple-500/20 to-transparent relative overflow-hidden">
    <div class="absolute top-0 left-0 h-full w-1/4 bg-gradient-to-r from-transparent via-sky-500/40 to-transparent animate-[slide_3s_ease-in-out_infinite]"></div>
  </div>

</header>

<style>
@keyframes slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}

/* Style pour les icônes Bootstrap */
.bi {
  display: inline-block;
  vertical-align: -0.125em;
}

/* Effet de focus pour accessibilité */
a:focus-visible {
  outline: 2px solid rgba(124, 58, 237, 0.5);
  outline-offset: 2px;
  border-radius: 6px;
}

/* Transition smooth */
header * {
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

/* Responsive */
@media (max-width: 768px) {
  .max-w-6xl {
    max-width: 100%;
    padding-left: 1rem;
    padding-right: 1rem;
  }
  
  nav {
    gap: 0.5rem;
  }
  
  a {
    padding: 0.5rem 0.75rem !important;
    font-size: 0.75rem !important;
  }
  
  .bi {
    font-size: 0.75rem;
  }
  
  /* Masquer le texte sur petits écrans */
  span:not(.bi):not(.text-xs) {
    font-size: 0.75rem;
  }
}

@media (max-width: 640px) {
  header .flex {
    flex-direction: column;
    gap: 0.75rem;
    padding-top: 0.75rem;
    padding-bottom: 0.75rem;
  }
  
  nav {
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }
}

/* Animation au chargement */
@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

header {
  animation: fadeInDown 0.3s ease-out;
}
</style>
